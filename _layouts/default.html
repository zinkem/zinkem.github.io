<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
    <script src="{{ '/assets/js/respond.js' | relative_url }}"></script>
    <!--[if lt IE 9]>
      <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
    <!--[if lt IE 8]>
    <link rel="stylesheet" href="{{ '/assets/css/ie.css' | relative_url }}">
    <![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@zinkemp" />
    <meta name="twitter:title" content="{{ page.title }}" />
    <meta name="twitter:image" content="https://zinkem.github.io/assets/logo_cropped.png" />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@8.4.0/dist/mermaid.min.js"></script>
  </head>
  <body>
    <nav class="site-nav">
      <a href="/" class="nav-link">Home</a>
      <a href="/about/" class="nav-link">About</a>
      <a href="{{ site.github.repository_url }}" class="nav-link">GitHub</a>
    </nav>
    <div class="wrapper">
      <section style="margin: 0px;">

        {{ content }}

      </section>

    </div>

    {% if site.google_analytics %}
      <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
      </script>
    {% endif %}
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Post link click animation - highlight, grow, overshoot left
        document.querySelectorAll('.post-link').forEach(function(link) {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            var href = this.href;
            var el = this;

            // Make sure transforms work
            el.style.display = 'inline-block';

            // Phase 1: highlight and grow
            el.style.transition = 'all 0.08s ease-out';
            el.style.transform = 'scale(1.08)';
            el.style.color = '#a8dff0';
            el.style.textShadow = '0 0 25px rgba(126, 200, 227, 0.9)';

            // Phase 2: overshoot left and fade
            setTimeout(function() {
              el.style.transition = 'all 0.07s ease-in';
              el.style.transform = 'translateX(-40px) scale(0.9)';
              el.style.opacity = '0';
            }, 80);

            // Navigate after animation
            setTimeout(function() {
              window.location.href = href;
            }, 150);
          });
        });
      });
    </script>
  </body>
</html>
