<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
    <script src="{{ '/assets/js/respond.js' | relative_url }}"></script>
    <!--[if lt IE 9]>
      <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
    <!--[if lt IE 8]>
    <link rel="stylesheet" href="{{ '/assets/css/ie.css' | relative_url }}">
    <![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@zinkemp" />
    <meta name="twitter:title" content="{{ page.title }}" />
    <meta name="twitter:image" content="https://zinkem.github.io/assets/logo_cropped.png" />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@8.4.0/dist/mermaid.min.js"></script>
  </head>
  <body>
    <nav class="site-nav">
      <a href="/" class="nav-link">Home</a>
      <a href="/about/" class="nav-link">About</a>
      <a href="{{ site.github.repository_url }}" class="nav-link">GitHub</a>
    </nav>
    <div class="wrapper">
      <section style="margin: 0px;">

        {{ content }}

      </section>

    </div>

    {% if site.google_analytics %}
      <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
      </script>
    {% endif %}
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Animate the whole post card on click
        document.querySelectorAll('.post-list li').forEach(function(card) {
          card.style.cursor = 'pointer';

          card.addEventListener('click', function(e) {
            var link = this.querySelector('.post-link');
            if (!link) return;

            e.preventDefault();
            e.stopPropagation();
            var href = link.href;

            // Phase 1: highlight and grow
            this.style.transition = 'all 0.1s ease-out';
            this.style.transform = 'scale(1.02)';
            this.style.borderLeftColor = '#7ec8e3';
            this.style.boxShadow = '0 0 30px rgba(126, 200, 227, 0.4)';
            link.style.color = '#a8dff0';
            link.style.textShadow = '0 0 20px rgba(126, 200, 227, 0.8)';

            // Phase 2: swipe left off screen
            setTimeout(function() {
              card.style.transition = 'transform 0.15s cubic-bezier(0.4, 0, 1, 1), opacity 0.1s ease-out';
              card.style.transform = 'translateX(-120%) scale(0.9)';
              card.style.opacity = '0';
            }, 100);

            // Navigate
            setTimeout(function() {
              window.location.href = href;
            }, 250);
          });
        });
      });
    </script>
  </body>
</html>
