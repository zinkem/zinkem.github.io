---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%b %-d, %Y" }}
      {% if page.project %}<span class="post-project">{{ page.project }}</span>{% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    <div class="nav-prev">
      {% if page.previous %}
        <a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title | truncate: 40 }}</a>
      {% endif %}
    </div>
    <div class="nav-next">
      {% if page.next %}
        <a href="{{ page.next.url | relative_url }}">{{ page.next.title | truncate: 40 }} &rarr;</a>
      {% endif %}
    </div>
  </nav>
</article>
